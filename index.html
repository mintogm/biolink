<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioLink Profile</title>
  <style>
    :root { --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 80px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* テーマ変数 */
    body.t-glass_purple  { --bg1:#120e2e; --bg2:#1e1035; --bg3:#0d1b2a; --b1:#7928ca; --b2:#ff0080; --b3:#0070f3; --ct:#fff; --cs:rgba(255,255,255,.7); --sb:rgba(255,255,255,.12); --sbd:rgba(255,255,255,.2); --hc:rgba(255,255,255,.5); background:linear-gradient(135deg,#120e2e 0%,#1e1035 50%,#0d1b2a 100%); }
    body.t-pastel_pink   { --bg1:#fdf6f0; --bg2:#f7dede; --bg3:#f3e7e4; --b1:#ffb7b2; --b2:#ffdac1; --b3:#e2f0cb; --ct:#4a3e3d; --cs:rgba(74,62,61,.6); --sb:#fff; --sbd:#f0d5d5; --hc:#8d7b7a; background:linear-gradient(135deg,#fceceb 0%,#f7dede 50%,#f3e7e4 100%); }
    body.t-dark_neon     { --bg1:#0a0a0f; --bg2:#1a162b; --bg3:#07070a; --b1:#00f2fe; --b2:#4facfe; --b3:#ff0844; --ct:#f8fafc; --cs:rgba(248,250,252,.6); --sb:#1e1e2d; --sbd:#28283c; --hc:#94a3b8; background:radial-gradient(circle at 50% 10%,#1a162b 0%,#07070a 100%); }
    body.t-clean_minimal { --bg1:#f8fafc; --bg2:#fff; --bg3:#f1f5f9; --b1:#cbd5e1; --b2:#e2e8f0; --b3:#f1f5f9; --ct:#0f172a; --cs:rgba(15,23,42,.5); --sb:#fff; --sbd:#e2e8f0; --hc:#64748b; background:linear-gradient(180deg,#fff 0%,#f1f5f9 100%); }
    body.t-sunset_orange { --bg1:#2b1055; --bg2:#75225b; --bg3:#b33939; --b1:#ff7e5f; --b2:#feb47b; --b3:#eb3349; --ct:#fff; --cs:rgba(255,255,255,.7); --sb:rgba(255,255,255,.15); --sbd:rgba(255,255,255,.25); --hc:#fcd34d; background:linear-gradient(135deg,#2b1055 0%,#75225b 50%,#b33939 100%); }
    body.t-emerald_green { --bg1:#093028; --bg2:#19523f; --bg3:#0d2818; --b1:#2ecc71; --b2:#10b981; --b3:#a7f3d0; --ct:#ecfdf5; --cs:rgba(236,253,245,.65); --sb:rgba(255,255,255,.12); --sbd:rgba(255,255,255,.18); --hc:#a7f3d0; background:linear-gradient(135deg,#093028 0%,#19523f 50%,#0d2818 100%); }
    body.t-ocean_breeze  { --bg1:#0f2027; --bg2:#203a43; --bg3:#2c5364; --b1:#00c6ff; --b2:#0072ff; --b3:#38ef7d; --ct:#f0f9ff; --cs:rgba(240,249,255,.65); --sb:rgba(255,255,255,.1); --sbd:rgba(255,255,255,.18); --hc:#7dd3fc; background:linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%); }

    /* ブロブ */
    .blobs { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .blob { position:absolute; border-radius:50%; filter:blur(80px); opacity:.4; animation:fb 14s infinite alternate ease-in-out; }
    .blob-1 { width:300px;height:300px; background:var(--b1); top:8%;left:12%; }
    .blob-2 { width:360px;height:360px; background:var(--b2); top:45%;right:10%; animation-duration:18s; animation-delay:-5s; }
    .blob-3 { width:260px;height:260px; background:var(--b3); bottom:12%;left:28%; animation-duration:22s; animation-delay:-10s; }
    @keyframes fb { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(25px,-35px) scale(1.08)} 100%{transform:translate(-18px,28px) scale(.94)} }

    /* パーティクル */
    #ac { position:fixed; inset:0; pointer-events:none; z-index:0; }

    /* メインコンテナ */
    .wrap { width:100%; max-width:460px; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }

    /* アバター */
    .av-ring { width:108px; height:108px; border-radius:50%; padding:3px; background:linear-gradient(135deg,var(--b1),var(--b2)); box-shadow:0 4px 24px rgba(0,0,0,.25); margin-bottom:16px; }
    .av-ring img { width:100%;height:100%; border-radius:50%; object-fit:cover; display:block; background:#fff; }
    .av-ph { width:100%;height:100%; border-radius:50%; background:#6366f1; color:#fff; font-size:40px; font-weight:800; display:flex; align-items:center; justify-content:center; }

    .dname { font-size:23px; font-weight:800; color:var(--ct); margin-bottom:4px; letter-spacing:-.02em; text-align:center; }
    .utag  { font-size:13px; font-weight:600; color:var(--cs); margin-bottom:12px; text-align:center; }
    .bio   { font-size:14px; line-height:1.65; color:var(--ct); opacity:.88; max-width:92%; margin:0 auto 28px; text-align:center; white-space:pre-wrap; word-break:break-word; }

    /* SNSバー */
    .sbar { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-bottom:32px; width:100%; }
    .sbtn { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--sb); border:1px solid var(--sbd); color:var(--ct); text-decoration:none; transition:all .22s cubic-bezier(.4,0,.2,1); backdrop-filter:blur(10px); }
    .sbtn:hover { transform:translateY(-3px) scale(1.1); box-shadow:0 6px 18px rgba(0,0,0,.2); }
    .sbtn svg { width:22px;height:22px; }

    /* リンク */
    .lsec { width:100%; display:flex; flex-direction:column; gap:14px; margin-bottom:40px; }

    /* ヘッダー */
    .lhdr { display:flex; align-items:center; gap:12px; margin:12px 0 2px; }
    .hline { flex:1; height:1px; background:var(--hc); opacity:.4; }
    .htitle { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--hc); }

    /* ボタン共通 */
    .lbtn { display:flex; align-items:center; padding:15px 18px; width:100%; text-decoration:none; transition:all .24s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden; }
    .s-pill    .lbtn { border-radius:9999px; }
    .s-rounded .lbtn { border-radius:16px; }
    .s-glass   .lbtn { border-radius:16px; backdrop-filter:blur(20px); }
    .s-shadow  .lbtn { border-radius:16px; }
    .lbtn:hover { transform:translateY(-3px) scale(1.02); }
    .lbtn:active { transform:scale(.98); }

    /* アイコン丸 */
    .bic { width:42px;height:42px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; margin-right:14px; backdrop-filter:blur(8px); box-shadow:0 2px 8px rgba(0,0,0,.18); }
    .bic svg { width:22px;height:22px; }
    .btxt { flex:1; min-width:0; text-align:left; }
    .btit { font-size:15px; font-weight:800; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 4px rgba(0,0,0,.35); }
    .bsub { font-size:12px; font-weight:500; color:rgba(255,255,255,.85); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .bright { display:flex; align-items:center; gap:6px; margin-left:10px; flex-shrink:0; }
    .barr { color:rgba(255,255,255,.9); transition:transform .2s; }
    .lbtn:hover .barr { transform:translateX(4px); }

    /* ボタン色 */
    .i-youtube   { background:linear-gradient(135deg,#ff0000,#b80000); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(255,0,0,.4); }
    .i-youtube:hover   { box-shadow:0 10px 28px rgba(255,0,0,.6); }
    .i-tiktok    { background:linear-gradient(135deg,#090a0f 0%,#fe2c55 55%,#25f4ee 100%); border:1px solid rgba(37,244,238,.5); box-shadow:0 6px 22px rgba(254,44,85,.4); }
    .i-tiktok:hover    { box-shadow:0 10px 30px rgba(254,44,85,.6); }
    .i-twitter   { background:linear-gradient(135deg,#24292e,#0d1117); border:1px solid rgba(255,255,255,.25); box-shadow:0 6px 20px rgba(0,0,0,.5); }
    .i-twitter:hover   { box-shadow:0 10px 28px rgba(0,0,0,.7); }
    .i-instagram { background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); border:1px solid rgba(255,255,255,.35); box-shadow:0 6px 22px rgba(225,48,108,.45); }
    .i-instagram:hover { box-shadow:0 10px 30px rgba(225,48,108,.65); }
    .i-line      { background:linear-gradient(135deg,#06c755,#009c3b); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(6,199,85,.45); }
    .i-line:hover      { box-shadow:0 10px 28px rgba(6,199,85,.65); }
    .i-discord   { background:linear-gradient(135deg,#5865f2,#3c45a5); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(88,101,242,.45); }
    .i-discord:hover   { box-shadow:0 10px 28px rgba(88,101,242,.65); }
    .i-twitch    { background:linear-gradient(135deg,#9146ff,#5c16c5); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(145,70,255,.45); }
    .i-twitch:hover    { box-shadow:0 10px 28px rgba(145,70,255,.65); }
    .i-shop      { background:linear-gradient(135deg,#f59e0b,#b45309); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(245,158,11,.45); }
    .i-shop:hover      { box-shadow:0 10px 28px rgba(245,158,11,.65); }
    .i-globe     { background:linear-gradient(135deg,#0284c7,#0369a1); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(2,132,199,.45); }
    .i-globe:hover     { box-shadow:0 10px 28px rgba(2,132,199,.65); }
    .i-mail      { background:linear-gradient(135deg,#6366f1,#4338ca); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(99,102,241,.45); }
    .i-mail:hover      { box-shadow:0 10px 28px rgba(99,102,241,.65); }
    .i-link      { background:linear-gradient(135deg,#8b5cf6,#4f46e5); border:1px solid rgba(255,255,255,.3); box-shadow:0 6px 20px rgba(139,92,246,.45); }
    .i-link:hover      { box-shadow:0 10px 28px rgba(139,92,246,.65); }

    /* バッジ */
    .badge { display:inline-flex; align-items:center; gap:3px; font-size:9px; font-weight:900; padding:2px 7px; border-radius:9999px; text-transform:uppercase; letter-spacing:.05em; animation:bp 2.2s infinite ease-in-out; white-space:nowrap; flex-shrink:0; }
    @keyframes bp { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
    .bh { background:linear-gradient(135deg,#ef4444,#f97316); color:#fff; border:1px solid rgba(255,255,255,.4); }
    .bl { background:linear-gradient(135deg,#dc2626,#7f1d1d); color:#fff; border:1px solid #f87171; }
    .bn { background:linear-gradient(135deg,#10b981,#059669); color:#fff; border:1px solid #6ee7b7; }
    .bg { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; border:1px solid #fde68a; }

    /* 再生ボタン */
    .pbtn { display:inline-flex; align-items:center; gap:3px; padding:4px 9px; border-radius:9999px; background:rgba(255,255,255,.2); backdrop-filter:blur(8px); color:#fff; font-size:10px; font-weight:800; border:1px solid rgba(255,255,255,.4); cursor:pointer; transition:all .2s; }
    .pbtn:hover { background:#fff; color:#000; transform:scale(1.08); }

    /* 動画モーダル */
    .vov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); backdrop-filter:blur(10px); z-index:9999; align-items:center; justify-content:center; padding:16px; }
    .vov.on { display:flex; }
    .vbox { width:100%; max-width:520px; border-radius:20px; background:#12131a; border:1px solid rgba(255,255,255,.15); box-shadow:0 30px 80px rgba(0,0,0,.85); overflow:hidden; animation:pi .25s cubic-bezier(.34,1.56,.64,1); }
    @keyframes pi { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }
    .vhdr { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.1); }
    .vtit { font-size:13px; font-weight:700; color:#fff; flex:1; margin-right:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .vcls { width:28px;height:28px; border-radius:50%; background:rgba(255,255,255,.1); border:none; color:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .vwrp { position:relative; width:100%; padding-bottom:56.25%; height:0; background:#000; }
    .vwrp iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
    .vft { padding:10px 16px; background:#181924; display:flex; justify-content:flex-end; }
    .voyt { display:inline-flex; align-items:center; gap:5px; background:#ff0000; color:#fff; padding:7px 14px; border-radius:9999px; font-size:12px; font-weight:700; text-decoration:none; }

    /* フッター */
    .foot { padding:16px 0; display:flex; justify-content:center; }
    .mw { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--cs); text-decoration:none; opacity:.65; transition:opacity .2s; }
    .mw:hover { opacity:1; }
    .mw strong { font-weight:800; color:var(--ct); }
  </style>
</head>
<body class="t-glass_purple s-pill">
  <div class="blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
  <canvas id="ac"></canvas>

  <div class="wrap">
    <div class="av-ring" id="avRing">
      <img id="avImg" src="" alt="" onerror="this.style.display='none';document.getElementById('avPh').style.display='flex'">
      <div class="av-ph" id="avPh" style="display:none"></div>
    </div>
    <h1 class="dname" id="dname"></h1>
    <p class="utag" id="utag"></p>
    <p class="bio" id="bio"></p>
    <nav class="sbar" id="sbar"></nav>
    <section class="lsec" id="lsec"></section>
    <footer class="foot"><a href="#" class="mw"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Created with <strong>BioLink</strong></a></footer>
  </div>

    <div class="vbox">
      <div class="vhdr"><span class="vtit" id="vtit"></span><button class="vcls" id="vcls">✕</button></div>

    </div>
  </div>

  <script src="profile-data.js"></script>

    twitch:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>`,
    shop:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
    globe:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
    mail:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`,
    link:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
  };

  function ytId(url) {
    const m = (url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function badgeHTML(b) {
    const M = { hot:['🔥 HOT','bh'], live:['🔴 LIVE','bl'], new:['✨ NEW','bn'], gift:['🎁 特典','bg'] };
    return M[b] ? `<span class="badge ${M[b][1]}">${M[b][0]}</span>` : '';
  }
  function esc(s) { return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function render(d) {
    document.title = `${d.display_name||'BioLink'} | BioLink`;
    document.body.className = `t-${d.theme||'glass_purple'} s-${d.button_style||'pill'}`;

    const img = document.getElementById('avImg');
    const ph  = document.getElementById('avPh');
    if (d.avatar_url) {
      img.src = d.avatar_url; img.style.display = 'block'; ph.style.display = 'none';
    } else {
      img.style.display = 'none'; ph.style.display = 'flex';
      ph.textContent = (d.display_name||'U')[0];
    }
    document.getElementById('dname').textContent = d.display_name || '';
    document.getElementById('utag').textContent  = `@${d.username||''}`;
    document.getElementById('bio').textContent   = d.bio || '';

    // SNSバー
    const sbar = document.getElementById('sbar');
    sbar.innerHTML = '';
    ['youtube','tiktok','twitter','instagram','line','discord','twitch','mail'].forEach(p => {
      const url = (d.social_links||{})[p]; if (!url) return;
      sbar.insertAdjacentHTML('beforeend',`<a class="sbtn" href="${esc(url)}" target="_blank" rel="noopener" title="${p}">${ICO[p]||ICO.link}</a>`);
    });

    // リンク一覧
    const sec = document.getElementById('lsec');
    sec.innerHTML = '';
    (d.links||[]).forEach(lnk => {
      if (!lnk.is_active) return;
      if (lnk.link_type === 'header') {
        sec.insertAdjacentHTML('beforeend',`<div class="lhdr"><span class="hline"></span><h2 class="htitle">${esc(lnk.title)}</h2><span class="hline"></span></div>`);
        return;
      }
      const ico = lnk.icon || 'link';
      const vid = ytId(lnk.url||'');
      const href = (lnk.url && !vid) ? lnk.url : 'javascript:void(0)';
      const tgt  = (lnk.url && !vid && !lnk.url.startsWith('mailto:')) ? 'target="_blank" rel="noopener noreferrer"' : '';
      const play = vid ? `<button class="pbtn" data-id="${vid}" data-t="${esc(lnk.title)}">▶ 再生</button>` : '';
      const arr  = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
      sec.insertAdjacentHTML('beforeend',
        `<a class="lbtn i-${ico}" href="${esc(href)}" ${tgt} data-vid="${vid||''}">
          <div class="bic">${ICO[ico]||ICO.link}</div>
          <div class="btxt">
            <div class="btit">${esc(lnk.title)}${badgeHTML(lnk.badge)}</div>
            ${lnk.subtitle?`<div class="bsub">${esc(lnk.subtitle)}</div>`:''}
          </div>
          <div class="bright">${play}<span class="barr">${arr}</span></div>
        </a>`
      );
    });

    // 動画モーダル & play
    sec.querySelectorAll('.lbtn[data-vid]').forEach(a => {
      const id = a.dataset.vid;
      if (!id) return;
      a.addEventListener('click', e => { if (!e.target.closest('.pbtn')) { e.preventDefault(); openV(id, a.querySelector('.btit').textContent.trim(), a.href); } });
    });
    sec.querySelectorAll('.pbtn').forEach(b => {
      b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openV(b.dataset.id, b.dataset.t, null); });
    });
  }

  const vov = document.getElementById('vov');
  const vf  = document.getElementById('vf');
  document.getElementById('vcls').onclick = () => { vov.classList.remove('on'); vf.src=''; };
  vov.addEventListener('click', e => { if(e.target===vov){ vov.classList.remove('on'); vf.src=''; } });

  function openV(id, title, url) {
    document.getElementById('vtit').textContent = title||'';
    vf.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
    document.getElementById('voyt').href = url||`https://www.youtube.com/watch?v=${id}`;
    vov.classList.add('on');
  }

  // パーティクル（多重起動・リーク防止）
  let pAnimId = null;
  let currentEf = null;
  let pResizeBound = false;

  function initP(ef) {
    const c = document.getElementById('ac');
    if (!ef || ef==='none') {
      if (pAnimId) { cancelAnimationFrame(pAnimId); pAnimId = null; }
      currentEf = null;
      c.style.display='none';
      return;
    }
    if (ef === currentEf && pAnimId) return; // 既に動作中なら何もしない
    currentEf = ef;
    c.style.display='block';

    const ctx = c.getContext('2d');
    const resize = () => { c.width = innerWidth; c.height = innerHeight; };
    resize();
    if (!pResizeBound) {
      window.addEventListener('resize', resize);
      pResizeBound = true;
    }

    if (pAnimId) cancelAnimationFrame(pAnimId);

    const count = ef==='stars' ? 80 : 45;
    const PS = Array.from({length: count}, () => {
      const p = { reset() {
        this.x = Math.random()*c.width; this.y = Math.random()*c.height;
        this.r = Math.random()*(ef==='stars'?1.5:ef==='sakura'?4:2.2)+(ef==='stars'?.3:.5);
        this.a = Math.random()*.6+.15; this.vx = (Math.random()-.5)*.35; this.vy = -Math.random()*.7-.2;
        this.life = 0; this.ml = Math.random()*160+80;
        this.h = ef==='sparkle' ? Math.random()*60+200 : ef==='sakura' ? Math.random()*30+330 : 50;
      }};
      p.reset(); p.life = Math.random()*p.ml; return p;
    });

    function loop() {
      ctx.clearRect(0,0,c.width,c.height);
      for(let i=0; i<PS.length; i++){
        const p = PS[i];
        p.x += p.vx; p.y += p.vy; p.life++;
        if(p.life > p.ml) p.reset();
        const pr = p.life/p.ml;
        const a = p.a * (pr<.2 ? pr/.2 : pr>.8 ? (1-pr)/.2 : 1);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${p.h},90%,75%,${a})`; ctx.fill();
      }
      pAnimId = requestAnimationFrame(loop);
    }
    loop();
  }

  function boot(d) {
    if (!d) return;
    render(d);
    initP(d.particle_effect||'sparkle');
  }

  // postMessage でリアルタイム更新（エディターから受信）
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'BIOLINK_UPDATE') boot(e.data.data);
  });

  // 初期データ: profile-data.js → localStorage の順でフォールバック
  let initData = window.BIOLINK_DATA || null;
  if (!initData) {
    try {
      const dbRaw = JSON.parse(localStorage.getItem('bls_v3') || '{}');
      const firstKey = Object.keys(dbRaw)[0];
      if (firstKey && dbRaw[firstKey]) initData = dbRaw[firstKey];
    } catch(_){}
  }
  if (!initData) { try { initData = JSON.parse(localStorage.getItem('biolink_data')); } catch(_){} }
  boot(initData);
  </script>
</body>
